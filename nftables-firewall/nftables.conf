#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        # accept any localhost traffic
        iif lo accept
        # accept traffic originated from us
        ct state established,related accept
        # drop and log SSH packets sent from some hosts (including Kali Linux VM)
        tcp dport 22 ip saddr { 172.19.201.1, 172.19.201.30 } log prefix "Blocked SSH packets: " drop
        # accept new SSH and DNS TCP packets (SSH from other hosts)
        tcp dport { 22, 53 } ct state new accept
        # accept new DNS UDP packets
        udp dport 53 ct state new accept

        # accept ICMP messages that require no responses
        ct state new,related,established icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

        # accept ICMPv6 messages that require no responses
        ct state new,related,established icmpv6 type { destination-unreachable, time-exceeded, parameter-problem } accept
        # accept neighbor discovery otherwise IPv6 connectivity breaks.
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept

        # count and drop any other traffic
        counter log prefix "Dropped packet: " drop
    }

    chain prerouting {
        type filter hook prerouting priority 0;
        # log and drop invalid packets
        ct state invalid counter log prefix "Invalid Packets: " drop
        # count and drop unexpected TCP segments with any flag set except for SYN
        tcp flags & (fin|syn|rst|ack) != syn ct state new counter log prefix "Invalid Packets 2: " drop
    }
}